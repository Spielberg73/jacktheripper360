name: Brujita APK

on:
  push:
    paths:
      - "brujita-euromillones/**"
      - ".github/workflows/brujita-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brujita-euromillones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: brujita-euromillones/android
      - uses: actions/upload-artifact@v4
        with:
          name: BrujitaDeLaSuerte-apk
          path: brujita-euromillones/android/app/build/outputs/apk/debug/app-debug.apk

name: NightDrive Player (Android APK)

on:
  push:
    paths:
      - 'MusicPlayer/src/**'
      - 'MusicPlayer/mobile/**'
      - '.github/workflows/nightdrive-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MusicPlayer/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MusicPlayer/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node build-web.mjs
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: MusicPlayer/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: NightDrive-Player-Android
          path: MusicPlayer/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

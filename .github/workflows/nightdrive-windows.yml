name: NightDrive Player (Windows build)

on:
  push:
    paths:
      - 'MusicPlayer/**'
      - '.github/workflows/nightdrive-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MusicPlayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MusicPlayer/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NightDrive-Player-Windows
          path: |
            MusicPlayer/dist/*.exe
          if-no-files-found: error
